<!doctype html>
<html lang="en" style="background: #111F1B">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#15332D" />
    <link rel="manifest" href="/riley/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/riley/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/riley/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/riley/icons/apple-touch-icon-180.png" />
    <link rel="apple-touch-startup-image" href="/riley/icons/launch/apple-splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/riley/icons/launch/apple-splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/riley/icons/launch/apple-splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/riley/icons/launch/apple-splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/riley/icons/launch/apple-splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/riley/icons/launch/apple-splash-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/riley/icons/launch/apple-splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/riley/icons/launch/apple-splash-1242x2688.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Render Rampage" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Riley's Render Rampage</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }

      html,
      body {
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #111F1B;
        color: #fff8eb;
        font-family: monospace;
      }

      /* Fixed to all four edges of the layout viewport, not 100dvh: on an iPhone home-screen app 100dvh came out about
         58 pt short of the screen (Walker's screenshot, 2026-11-08: black band under the table). */
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        /* No bottom safe-area padding (Walker, 2026-11-08: "still doesn't scale to fit"): on a 393x852 iPhone it left a 34 pt
           band that made the table height-limited, 12 pt narrower than the screen. The table's bottom edge is only the
           drain and the History/Info labels, so it may run under the home indicator. */
        padding-bottom: 0;
        padding-left: env(safe-area-inset-left);
      }

      /* The Mac side panels (SPEC.md §9.6): off until main.ts finds a wide, tall window. The phone never shows them. */
      #suite-left,
      #suite-right {
        display: none;
        position: fixed;
        z-index: 1;
        pointer-events: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      html.mac-suite,
      html.mac-suite body {
        background: #0f0f0f;
      }

      #hud-canvas,
      #game-canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* Phones in landscape: "Turn your phone upright" (SPEC.md §12.2). Text is set from riley.ts. main.ts pauses the game on this same query. */
      #rotate-notice {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #142420;
        color: #ffd438;
        font-family: monospace;
        font-size: 22px;
        letter-spacing: 0.06em;
        text-align: center;
        text-transform: uppercase;
      }

      @media (orientation: landscape) and (max-height: 500px) {
        #rotate-notice {
          display: flex;
        }
      }
    </style>
    <script type="module" crossorigin src="/riley/assets/index-CTADYPG0.js"></script>
  </head>
  <body style="background: #111F1B">
    <div id="app">
      <canvas id="hud-canvas"></canvas>
      <canvas id="game-canvas"></canvas>
    </div>
    <canvas id="suite-left" aria-hidden="true"></canvas>
    <canvas id="suite-right" aria-hidden="true"></canvas>
    <div id="rotate-notice" role="status"><p id="rotate-text"></p></div>
  </body>
</html>
